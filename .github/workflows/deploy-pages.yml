name: Deploy to GitHub Pages

# Publishes the static export so the build can be shared as a link.
# configure-pages enables Pages on first run, so no manual repository setup is
# needed. If your org policy blocks that, turn it on by hand instead:
# Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/robotic-mowing-underwriting-mvp-cagnv0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test calculation engine
        run: npm test

      - name: Build static export
        # BASE_PATH is the repository name, because project Pages sites are
        # served from https://<owner>.github.io/<repo>/.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build

      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site via the API if it does not exist yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
