name: Build and deploy

# Two jobs on purpose:
#
#   build    always runs and uploads the exported site as a downloadable
#            "static-site" artifact built for a ROOT-served host, so there is
#            a deployable folder even if Pages is never set up. Download it
#            from the run page and drop it on Netlify, Cloudflare, S3 or a
#            plain web server.
#
#   publish  pushes the same output to GitHub Pages. This job fails until
#            Pages is enabled for the repository:
#            Settings → Pages → Source → "GitHub Actions".
#            A failure here does not affect the artifact from `build`.
on:
  push:
    branches:
      - main
      - claude/robotic-mowing-underwriting-mvp-cagnv0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test calculation engine
        run: npm test

      # Two builds, because asset paths differ by where the site is mounted.
      # Project Pages sites live at https://<owner>.github.io/<repo>/, while
      # Netlify, Cloudflare, S3 and a plain web server serve from the root.
      # A build made for one renders blank on the other.

      - name: Build for GitHub Pages (subdirectory)
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Build for a root-served host
        run: rm -rf out && npm run build

      # Portable copy: download this from the run page, unzip it, and drop the
      # folder on any static host.
      - name: Upload downloadable site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
